name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the mod jar
        run: ./gradlew build --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v6
        with:
          name: bleach-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Boots a headless Minecraft server with the mod and runs every game test.
      # A dev test server needs the Minecraft EULA accepted in its run folder.
      - name: Run game tests
        run: |
          set -o pipefail
          mkdir -p run/gametest
          echo "eula=true" > run/gametest/eula.txt
          ./gradlew runGameTestServer --stacktrace 2>&1 | tee gametest.log
          grep -E "All [0-9]+ required tests passed" gametest.log

      - name: Upload the game test log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gametest-log
          path: |
            gametest.log
            run/gametest/logs/
          if-no-files-found: ignore

  # Starts the real game client under a virtual display and runs ClientSmokeTest: it makes a world,
  # becomes a Plus and then a Hollow with the camera behind the player, and quits. Game tests only
  # run on a server, so this is what catches crashes in rendering, the HUD and the client mixins.
  client-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install a virtual display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Run the client smoke test
        run: |
          set -o pipefail
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientSmokeTest --stacktrace 2>&1 | tee client.log
          grep -F "Bleach client smoke test passed" client.log

      - name: Upload the client log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: client-smoke-test-log
          path: |
            client.log
            run/smoketest/logs/
            run/smoketest/crash-reports/
          if-no-files-found: ignore
