name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the mod jar
        run: ./gradlew build --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: bleach-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Boots a headless Minecraft server with the mod and runs every game test.
      # A dev test server needs the Minecraft EULA accepted in its run folder.
      - name: Run game tests
        run: |
          set -o pipefail
          mkdir -p run/gametest
          echo "eula=true" > run/gametest/eula.txt
          ./gradlew runGameTestServer --stacktrace 2>&1 | tee gametest.log
          grep -E "All [0-9]+ required tests passed" gametest.log

      - name: Upload the game test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-log
          path: |
            gametest.log
            run/gametest/logs/
          if-no-files-found: ignore
